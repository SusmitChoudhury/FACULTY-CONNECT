  <body class="bg-[#FCF9EA] text-[#000000] antialiased selection:bg-[#F2842F]/30 selection:text-[#000000]">
    <div id="root"></div>
    <script>
      // Register Service Worker for PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('Faculty Connect Service Worker registered with scope:', registration.scope);
              registration.update();
            },
            (err) => {
              console.log('Faculty Connect Service Worker registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
